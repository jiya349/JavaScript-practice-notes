<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Document</title>
</head>

<body class="font-sans">
  <div class="flex hover cursor-pointer justify-between bg-[#141414] h-15 m-10 p-4 items-center rounded-[15px] shadow-lg shadow-gray-500/50" >
    <div class="1 flex ">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none" class="bg-[#262626] rounded-lg">
      <defs>
        <linearGradient id="lg-mark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"></stop>
          <stop offset="100%" stop-color="#a1a1aa"></stop>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="36" height="36" rx="10" fill="#ffffff" opacity="0.08"></rect>
      <path d="M11 25 L17 13 L29 13" stroke="url(#lg-mark)" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round"></path>
      <circle cx="29" cy="13" r="2.6" fill="#fbbf24">
        <animate attributeName="r" values="2.6;3.6;2.6" dur="2.4s" repeatCount="indefinite"></animate>
      </circle>
      <circle cx="11" cy="25" r="2.2" fill="#ffffff"></circle>
    </svg>
    <h1 class="flex text-white">freeAPI.app</h1>
  </div>
    <div class="2 flex gap-8 text-[#9E9894]">
      <p class="hover:text-white">Endpoints</p>
      <p class="hover:text-white">Anatomy</p>
      <p class="hover:text-white">Playground</p>
      <p class="hover:text-white">Why</p>
      <p class="hover:text-white">Docs</p>
      <p class="hover:text-white">Learn</p>
    </div>
    <div class="3 h-10 w-40 bg-white flex rounded-lg items-center">
<img src="github-outline.svg  " class="h-10" alt="">
<h1>Star on Github</h1>
    </div>
  </div>
</body>

</html>
